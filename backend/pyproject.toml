[project]
name = "adsops-backend"
version = "0.1.0"
description = "AdsOps Control Center — account registry and evidence-based operational readiness"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
