# AdsOps Control Center — TLS edge for a self-managed VPS.
#
# Only used with the `edge` profile. On Coolify or Vibe Host the platform proxy already does
# this job, and running a second terminator would just be another thing to keep patched.
#
# Certificates are mounted read-only from TLS_CERT_DIR as fullchain.pem / privkey.pem.
#
# `server_name _` on purpose: nginx does not expand environment variables in a plain config,
# and a half-expanded ${VAR} would silently become a literal hostname that matches nothing.
# The certificate decides which host this edge legitimately answers for.

# Plain HTTP exists only to answer ACME and to send everyone to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Don't advertise the exact nginx build to whoever is scanning.
    server_tokens off;

    # Conservative, and deliberately so: nothing in this product uploads a file yet, and a
    # generous default would be a gift to whoever finds the first unauthenticated POST.
    client_max_body_size 2m;
    client_body_timeout  15s;
    client_header_timeout 15s;

    # Enable only once HTTPS is confirmed stable on the real domain — a premature HSTS header
    # locks browsers out of a site whose certificate is not yet right.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # The app loads no third-party script, font or frame, so the policy can be strict.
    # 'unsafe-inline' for style- covers the inline critical styles Vite emits.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
