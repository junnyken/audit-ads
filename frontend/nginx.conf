server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No secret is ever built into the bundle, but the app is an internal operations tool:
    # keep it out of search indexes and out of frames.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # No third-party script, font or frame is loaded anywhere in this app.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    server_tokens off;
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://api:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
