<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>AdsOps Control Center</title>
  </head>
  <body class="selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script>
      try {
        if (!navigator.userAgent.includes('jsdom') && !localStorage.getItem('adsops.theme')) {
          localStorage.setItem('adsops.theme', 'dark');
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <!-- Written by nginx at container start. Must load BEFORE the bundle. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
